<section
  class="px-4 py-14 sm:px-6 sm:py-20"
  aria-labelledby="cta-heading"
>
  <div
    class="mx-auto max-w-2xl rounded-2xl border border-white/[0.06] bg-surface-800/50 px-6 py-10 shadow-xl shadow-black/20 backdrop-blur-sm sm:px-10 sm:py-12"
  >
    <h2
      id="cta-heading"
      class="font-display text-2xl font-semibold leading-snug tracking-tight text-zinc-50 sm:text-3xl"
    >
      {{ copy.ctaFinalTitle }}
    </h2>
    <p
      class="mt-3 text-left text-[15px] leading-relaxed text-zinc-400 sm:text-center sm:text-base"
    >
      {{ copy.ctaFinalSub }}
    </p>
    <div class="mt-8 flex justify-center">
      <app-whatsapp-cta
        [label]="copy.ctaWhatsapp"
        size="lg"
        class="w-full max-w-md"
      />
    </div>
    <p
      class="mt-4 text-left text-xs leading-relaxed text-zinc-600 sm:text-center sm:text-sm"
    >
      A mesma conversa do início ao fim. Sem automação, sem gravação robótica.
    </p>
    <div
      class="mt-8 flex flex-col items-center gap-2 border-t border-white/[0.06] pt-8"
    >
      <span class="text-[10px] font-medium uppercase tracking-[0.2em] text-zinc-500"
        >Instagram</span
      >
      <app-instagram-cta />
    </div>
  </div>
</section>
