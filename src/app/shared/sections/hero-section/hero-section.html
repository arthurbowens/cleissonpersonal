<section
  id="topo"
  class="relative overflow-hidden border-b border-white/[0.04] px-4 pb-16 pt-10 sm:px-6 sm:pb-24 sm:pt-12 lg:pb-28 lg:pt-16"
  aria-labelledby="hero-heading"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(80%_60%_at_50%_-20%,rgba(6,182,212,0.15),transparent)]"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -right-20 top-0 h-96 w-96 rounded-full bg-cyan-500/5 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="relative mx-auto grid max-w-6xl gap-12 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,0.95fr)] lg:items-center lg:gap-12 xl:gap-16"
  >
    <div>
      <p
        class="text-[11px] font-semibold uppercase tracking-[0.2em] text-cyan-400/90 sm:text-xs"
      >
        {{ site.brand }}
      </p>
      <h1
        id="hero-heading"
        class="mt-3 font-display text-[1.65rem] font-semibold leading-[1.2] tracking-[-0.02em] text-zinc-50 sm:text-4xl lg:text-[2.4rem] xl:text-5xl"
      >
        {{ copy.heroHeadline }}
      </h1>
      <p class="mt-5 max-w-lg text-base leading-relaxed text-zinc-400 sm:text-lg sm:leading-relaxed">
        {{ copy.heroSub }}
      </p>
      <div class="mt-8 max-w-md sm:mt-10">
        <app-whatsapp-cta [label]="copy.ctaWhatsapp" size="lg" class="w-full" />
        <p
          class="mt-3 text-left text-sm leading-relaxed text-zinc-500"
        >
          {{ copy.ctaTrust }}
        </p>
      </div>
      <a
        class="mt-4 inline-block text-sm font-medium text-cyan-400/90 underline decoration-cyan-500/20 underline-offset-[5px] transition hover:text-cyan-300/90"
        href="#sobre"
      >
        Conhecer metodologia e o profissional
      </a>
      <p class="mt-5 text-xs text-zinc-600 sm:mt-6 sm:text-sm">
        Atendimento presencial ou no domicílio, conforme avaliação.
      </p>
    </div>
    <div
      class="relative mx-auto w-full max-w-md [perspective:1200px] lg:mx-0 lg:max-w-none"
    >
      <div
        class="absolute -inset-0.5 rounded-3xl bg-gradient-to-br from-cyan-500/25 via-transparent to-indigo-500/10 opacity-60 blur-2xl"
        aria-hidden="true"
      ></div>
      <figure
        class="relative aspect-[4/5] w-full max-w-md overflow-hidden rounded-2xl border border-white/[0.08] bg-surface-800/80 shadow-2xl ring-1 ring-white/[0.04] sm:max-w-lg lg:max-w-none"
      >
        <img
          src="/foto1.jpeg"
          width="720"
          height="900"
          class="h-full w-full object-cover object-center"
          alt="Cleisson, personal trainer"
          loading="eager"
          fetchpriority="high"
        />
      </figure>
    </div>
  </div>
</section>
