<section
  id="topo"
  class="relative overflow-hidden px-4 pb-20 pt-12 sm:px-6 sm:pb-28 sm:pt-16 lg:pb-32 lg:pt-20"
  aria-labelledby="hero-heading"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_80%_50%_at_50%_-20%,rgba(14,165,233,0.22),transparent)]"
    aria-hidden="true"
  ></div>
  <div class="relative mx-auto grid max-w-6xl gap-10 lg:grid-cols-2 lg:items-center lg:gap-14">
    <div>
      <p class="text-sm font-semibold uppercase tracking-wider text-celeste-400">{{ site.brand }}</p>
      <h1
        id="hero-heading"
        class="mt-2 font-display text-3xl font-bold leading-tight tracking-tight text-white text-balance sm:text-4xl lg:text-5xl"
      >
        {{ copy.heroHeadline }}
      </h1>
      <p class="mt-5 max-w-2xl text-lg leading-relaxed text-stone-400">
        {{ copy.heroSub }}
      </p>
      <div class="mt-8 max-w-xl sm:mt-10">
        <app-whatsapp-cta [label]="copy.ctaWhatsapp" size="lg" class="w-full" />
        <p class="mt-3 text-sm leading-relaxed text-stone-500 sm:max-w-lg">
          {{ copy.ctaTrust }}
        </p>
      </div>
      <a
        class="mt-4 inline-block text-sm font-medium text-stone-400 underline decoration-white/20 underline-offset-2 hover:text-celeste-200"
        href="#sobre"
      >
        Ver quem é o Cleisson e como funciona
      </a>
      <p class="mt-5 text-sm text-stone-600 sm:mt-6">
        Presencial e em domicílio, conforme a sua necessidade.
      </p>
    </div>
    <div class="relative mx-auto w-full max-w-md lg:max-w-none">
      <div
        class="absolute -inset-1 rounded-3xl bg-gradient-to-br from-celeste-500/40 via-celeste-600/20 to-transparent opacity-70 blur-sm"
        aria-hidden="true"
      ></div>
      <figure
        class="relative overflow-hidden rounded-2xl border border-white/10 bg-gremio-900 shadow-2xl shadow-black/50 ring-2 ring-celeste-500/30"
      >
        <img
          src="/foto1.jpeg"
          width="720"
          height="900"
          class="aspect-[4/5] w-full object-cover object-center sm:aspect-[3/4] lg:aspect-[4/5]"
          alt="Cleisson, personal trainer"
          loading="eager"
          fetchpriority="high"
        />
      </figure>
    </div>
  </div>
</section>
